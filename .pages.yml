media:
  - name: pack_photos
    label: Pack Photos
    input: assets/images/pack3963photos
    output: /assets/images/pack3963photos
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe
    commit:
      templates:
        create: "chore(photos): upload {filename}"
        update: "chore(photos): update {filename}"
        delete: "chore(photos): remove {filename}"
        rename: "chore(photos): rename {oldFilename} to {newFilename}"

content:
  - name: pack_settings
    label: Pack Settings
    type: file
    path: _data/pack.yml
    format: yaml
    fields:
      - { name: name, label: Pack Name, type: string, required: true }
      - { name: short_name, label: Short Name, type: string, required: true }
      - { name: city, label: City, type: string, required: true }
      - { name: state, label: State, type: string, required: true }
      - { name: service_area, label: Service Area, type: string, required: true }
      - { name: email, label: Public Email, type: string, required: true }
      - { name: phone, label: Public Phone, type: string, required: true }
      - { name: registration_url, label: Registration URL, type: string, required: true }
      - { name: facebook_url, label: Facebook Page URL, type: string, required: false }
      - { name: instagram_url, label: Instagram Profile URL, type: string, required: false }
      - { name: analytics_id, label: Google Analytics ID, type: string, required: false }
      - name: meeting
        label: Meeting Details
        type: object
        fields:
          - { name: venue, label: Venue, type: string, required: true }
          - { name: street, label: Street Address, type: string, required: true }
          - { name: city_state_zip, label: City State ZIP, type: string, required: true }
          - { name: schedule, label: Schedule, type: string, required: true }

  - name: events
    label: Events
    type: file
    path: _data/events.yml
    format: yaml
    fields:
      - { name: season, label: Season Heading, type: string, required: true }
      - name: events
        label: Upcoming Events
        type: object
        list: true
        fields:
          - { name: id, label: Event ID, type: string, required: true }
          - { name: date, label: Start Date, type: date, required: true }
          - { name: end_date, label: End Date, type: date, required: false }
          - { name: date_label, label: Display Date, type: string, required: true }
          - { name: title, label: Event Title, type: string, required: true }
          - { name: time, label: Time, type: string, required: true }
          - { name: location, label: Location, type: string, required: true }
          - { name: location_url, label: Location Map URL, type: string, required: false }
          - { name: featured, label: Feature on Home Page, type: boolean, required: false }
          - { name: announcement, label: Announcement Text, type: string, required: false }
          - { name: description, label: Description, type: text, required: true }
          - { name: checklist, label: What to Bring, type: string, list: true, required: false }
          - { name: signup_label, label: Signup Button Label, type: string, required: false }
          - { name: signup_url, label: Signup URL, type: string, required: false }

  - name: community_events
    label: Eden UCC Community Events
    type: file
    path: _data/community_events.yml
    format: yaml
    fields:
      - { name: heading, label: Section Heading, type: string, required: true }
      - { name: intro, label: Section Introduction, type: text, required: true }
      - name: events
        label: Community Events
        type: object
        list: true
        fields:
          - { name: id, label: Event ID, type: string, required: true }
          - { name: date, label: Start Date, type: date, required: true }
          - { name: end_date, label: End Date, type: date, required: false }
          - { name: date_label, label: Display Date, type: string, required: true }
          - { name: title, label: Event Title, type: string, required: true }
          - { name: time, label: Time, type: string, required: true }
          - { name: location, label: Location, type: string, required: true }
          - { name: organizer, label: Organizer, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: signup_label, label: Primary Button Label, type: string, required: false }
          - { name: signup_url, label: Primary Button URL, type: string, required: false }
          - { name: payment_label, label: Payment Button Label, type: string, required: false }
          - { name: payment_url, label: Payment URL, type: string, required: false }
          - { name: contact_label, label: Contact Button Label, type: string, required: false }
          - { name: contact_url, label: Contact URL, type: string, required: false }
      - name: resources
        label: Flyers and Forms
        type: object
        list: true
        fields:
          - { name: title, label: Resource Title, type: string, required: true }
          - { name: image, label: Image Path, type: string, required: true }
          - { name: alt, label: Image Description, type: text, required: true }
          - { name: end_date, label: Hide After, type: date, required: true }

  - name: photo_gallery
    label: Photo Gallery
    type: file
    path: _data/photos.yml
    format: yaml
    fields:
      - name: photos
        label: Published Photos
        type: object
        list: true
        fields:
          - name: file
            label: Photo
            type: image
            required: true
            options:
              media: pack_photos
              categories: [image]
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: caption
            label: Caption
            type: string
            required: false
          - name: alt
            label: Image Description
            type: string
            required: true
          - name: date
            label: Event Date
            type: date
            required: false

settings:
  commit:
    identity: user
    templates:
      update: "content(photos): update gallery"
