season: 2026–27 Season
events:
  - id: nature-hike-2026
    date: "2026-09-26"
    date_label: Saturday, September 26
    title: First Nature Hike of the Season
    time: 9:30 AM
    location: meeting
    location_url: https://goo.gl/maps/Zn2eXZFrYFTFZKrV7
    featured: true
    announcement: Nature hike this Saturday, September 26 at 9:30 AM — meet at Eden Church.
    description: >-
      We will begin and end at Eden Church while exploring LaBagh Woods and Forest Glen Woods
      by way of the Weber Spur, an old railroad trail. It is a good, long walk, so please arrive
      ready to hike.
    checklist:
      - Good shoes for hiking
      - A water bottle filled with water
      - A healthy, portable snack such as trail mix, jerky, or apples
      - Sun protection, such as a hat or sunscreen
      - A small backpack for carrying your supplies
