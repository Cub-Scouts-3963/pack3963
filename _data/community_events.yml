    date: "2026-10-12"
    date_label: Monday, October 12
    title: FunDays – Bowling at Habetler Bowl
    time: 9:30 AM–3:00 PM
    location: Drop-off and pickup at Eden UCC, 5051 W. Gunnison St., Chicago
    organizer: Eden UCC and Redeemer of Calvary UMC
    description: >-
      A supervised autumn outing for children ages 6–13 featuring bowling, followed by gym time
      and games at Eden. The fee is $50, with a 10% sibling discount; financial assistance is
      available. Registration and payment are due one week before the activity.
